name: Docker Build, Push and Test

on:
  workflow_dispatch:
  push:
    branches: [ cinema, main ]
    paths:
      - 'src/**'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  MONOLITH_IMAGE_NAME: ${{ github.repository }}/monolith
  MOVIES_SERVICE_IMAGE_NAME: ${{ github.repository }}/movies-service
  EVENTS_SERVICE_IMAGE_NAME: ${{ github.repository }}/events-service
  PROXY_SERVICE_IMAGE_NAME: ${{ github.repository }}/proxy-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Monolith
      - name: Extract metadata (tags, labels) for Monolith
        id: meta-monolith
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.MONOLITH_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Monolith Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/monolith
          push: true
          tags: ${{ steps.meta-monolith.outputs.tags }}
          labels: ${{ steps.meta-monolith.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Movies Service
      - name: Extract metadata (tags, labels) for Movies Service
        id: meta-movies
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.MOVIES_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Movies Service Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/microservices/movies
          push: true
          tags: ${{ steps.meta-movies.outputs.tags }}
          labels: ${{ steps.meta-movies.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Events Service
      - name: Extract metadata (tags, labels) for Events Service
        id: meta-events
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.EVENTS_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Events Service Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/microservices/events
          push: true
          tags: ${{ steps.meta-events.outputs.tags }}
          labels: ${{ steps.meta-events.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proxy Service
      - name: Extract metadata (tags, labels) for Proxy Service
        id: meta-proxy
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROXY_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Proxy Service Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/microservices/proxy
          push: true
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api-tests:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Start all services with Docker Compose
        run: |
          # Запускаем всю инфраструктуру и приложение
          docker-compose -f docker-compose.yml up -d
          sleep 15

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to be ready..."
          sleep 25
          
          # Проверяем основной endpoint
          echo "Testing proxy connection..."
          if curl -f -s http://localhost:8000/health > /dev/null; then
            echo "✓ Proxy service is ready!"
          else
            echo "⚠️ Proxy health check failed, but continuing with tests..."
            # Не выходим с ошибкой, пусть тесты сами решат
          fi
          
          # Даем еще немного времени для полной инициализации
          sleep 5

      - name: Run API tests
        run: |
          # Устанавливаем Newman с репортером
          echo "Installing testing tools..."
          npm install -g newman newman-reporter-htmlextra
          
          # Проверяем, есть ли коллекция для тестов
          if [ -f "api-tests-collection.json" ]; then
            echo "Running Newman tests..."
            newman run api-tests-collection.json \
              --env-var "baseUrl=http://localhost:8000" \
              --reporters cli,htmlextra \
              --reporter-htmlextra-export test-report.html \
              --delay-request 1000
          else
            echo "No Newman collection found, running basic tests..."
            # Базовые проверки
            curl -f http://localhost:8000/health && echo "Health: OK"
            curl -f http://localhost:8000/api/movies && echo "Movies: OK"
            curl -f http://localhost:8000/api/events && echo "Events: OK"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            test-report.html
            newman-report.html

      - name: Show logs if tests fail
        if: failure()
        run: |
          echo "=== PROXY SERVICE LOGS ==="
          docker-compose -f docker-compose.yml logs proxy-service
          echo "=== EVENTS SERVICE LOGS ==="
          docker-compose -f docker-compose.yml logs events-service
          echo "=== MOVIES SERVICE LOGS ==="
          docker-compose -f docker-compose.yml logs movies-service
          echo "=== KAFKA LOGS ==="
          docker-compose -f docker-compose.yml logs kafka
          echo "=== POSTGRES LOGS ==="
          docker-compose -f docker-compose.yml logs postgres

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.yml down -v