name: API Tests

on:
  push:
    branches: [ main, cinema ]
  pull_request:
    branches: [ main, cinema ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: cinemaabyss
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      zookeeper:
        image: wurstmeister/zookeeper:latest
        options: >-
          --health-cmd "echo ruok | nc localhost 2181"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      kafka:
        image: wurstmeister/kafka:2.13-2.7.0
        env:
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        options: >-
          --health-cmd "nc -z localhost 9092 || exit 0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose
          docker compose --version
      
      - name: Wait for infrastructure services
        run: |
          echo "Waiting for infrastructure to be ready..."
          
          # Ждем готовности PostgreSQL
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U postgres; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 5
          done
          
          # Ждем готовности Kafka через zookeeper
          echo "Waiting for Kafka to be ready..."
          for i in {1..30}; do
            if echo "ls /brokers/ids" | docker compose exec -T zookeeper zookeeper-shell localhost:2181 | grep -q "broker"; then
              echo "Kafka broker is registered in ZooKeeper!"
              break
            fi
            echo "Waiting for Kafka... ($i/30)"
            sleep 5
          done
      
      - name: Start application services
        run: |
          docker compose up -d monolith movies-service events-service proxy-service
          echo "Waiting for application services to be ready..."
          sleep 30
      
      - name: Initialize test data
        run: |
          docker compose exec -T postgres psql -U postgres -d cinemaabyss -f /docker-entrypoint-initdb.d/init.sql || echo "Database initialization completed"

      - name: Check services status
        run: |
          docker compose ps
          echo "Checking proxy service health..."
          for i in {1..10}; do
            if curl -f http://localhost:8000/health; then
              echo "Proxy service is healthy!"
              break
            elif [ $i -eq 10 ]; then
              echo "ERROR: Proxy service health check failed after 10 attempts"
              exit 1
            fi
            echo "Waiting for proxy service... ($i/10)"
            sleep 5
          done
          
          echo "Checking movies service..."
          curl --retry 5 --retry-delay 3 http://localhost:8081/health || echo "Movies service health check failed"
          
          echo "Checking events service..."
          curl --retry 5 --retry-delay 3 http://localhost:8082/health || echo "Events service health check failed"
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json
      
      - name: Install Newman dependencies
        working-directory: tests/postman
        run: |
          # Убедимся, что есть package.json
          if [ ! -f package.json ]; then
            echo '{"name":"postman-tests","version":"1.0.0"}' > package.json
          fi
          npm install newman@^6.0.0 newman-reporter-htmlextra@^1.23.0
      
      - name: Check if Postman collection exists
        working-directory: tests/postman
        run: |
          if [ ! -f "CinemaAbyss.postman_collection.json" ]; then
            echo "ERROR: Postman collection file not found!"
            echo "Available files:"
            ls -la
            exit 1
          fi
          echo "Postman collection found: CinemaAbyss.postman_collection.json"
      
      - name: Wait for proxy to be fully ready
        run: |
          echo "Waiting for proxy service to route requests..."
          sleep 15
          # Test that proxy can route to backend services
          curl -f http://localhost:8000/api/movies || echo "Proxy routing test failed"
          curl -f http://localhost:8000/api/events || echo "Proxy routing test failed"
      
      - name: Run API tests with Newman
        working-directory: tests/postman
        run: |
          echo "Running API tests against proxy service (port 8000)"
          
          # Запускаем тесты с увеличенным таймаутом и возможностью повтора
          max_attempts=3
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts"
            
            npx newman run CinemaAbyss.postman_collection.json \
              --env-var "baseUrl=http://localhost:8000" \
              --reporters cli,htmlextra \
              --reporter-htmlextra-export newman-report.html \
              --delay-request 2000 \
              --timeout 600000 \
              --bail || true
              
            if [ $? -eq 0 ]; then
              echo "API tests passed on attempt $attempt"
              break
            else
              echo "API tests failed on attempt $attempt"
              if [ $attempt -eq $max_attempts ]; then
                echo "All attempts failed, exiting with error"
                exit 1
              fi
              echo "Waiting 10 seconds before retry..."
              sleep 10
              attempt=$((attempt+1))
            fi
          done
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-test-reports
          path: tests/postman/newman-report.html
      
      - name: Show service logs if tests fail
        if: failure()
        run: |
          echo "=== DETAILED SERVICE LOGS ==="
          docker compose logs --tail=100
          
          echo "=== NETWORK STATUS ==="
          docker network inspect $(docker compose ps -q | head -1 | xargs docker inspect --format='{{.HostConfig.NetworkMode}}') || true
          
          echo "=== CONTAINER STATUS ==="
          docker ps -a
          docker stats --no-stream || true
      
      - name: Stop services
        if: always()
        run: |
          docker compose down -v --remove-orphans